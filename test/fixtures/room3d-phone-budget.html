<!doctype html><html><head><meta charset="UTF-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#home{margin:0;width:100%;height:100%;overflow:hidden}</style></head><body><div id="home"></div><script type="module">
import {mountHomeEditor} from '/apps/room3d/editor.js';import {createHome} from '/apps/room3d/model.js';import '/apps/room3d/editor.css';
const c=await fetch('/room3d/catalog.json').then(r=>r.json()),h=createHome(c),base=h.rooms[0],legacy=new URLSearchParams(location.search).has('legacy');h.rooms=Array.from({length:legacy?6:5},(_,n)=>({...base,id:'r'+n,x:n,z:0,name:'小屋 '+(n+1),items:Array.from({length:15},(_,i)=>({id:`r${n}-chair-${i}`,assetId:'gaming_chair',x:(i%5-2)*1.65,y:.15,z:(Math.floor(i/5)-1)*2.15,rotation:0,color:null,stored:false})),boundaries:{left:{kind:n?'open':'wall_high'},right:{kind:n<(legacy?5:4)?'open':'wall_high'},front:{kind:'wall_high'},back:{kind:'wall_high'}}}));h.activeRoomId='r0';
const e=await mountHomeEditor(document.querySelector('#home'),{assetBase:new URL('/room3d/',location.href).href,initialState:h});window.__homeEditor=e;window.render_game_to_text=()=>JSON.stringify(e.inspect());window.advanceTime=ms=>e.advanceTime(ms);
</script></body></html>
