<!doctype html><html><head><meta charset="UTF-8"><link rel="icon" href="data:,"><style>body{margin:0}</style></head><body><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {createDoor} from '../../apps/room3d/doorMeshes.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#eee8e1');scene.add(new T.HemisphereLight('#fff9f3','#b5a28d',2));const light=new T.DirectionalLight('#ffffff',3);light.position.set(3,6,5);scene.add(light);const template=(await new GLTFLoader().loadAsync('/room3d/showroom-door.glb')).scene,door=createDoor({kind:'ribbon',width:2.2},null,null,false,template);scene.add(door);const cam=new T.PerspectiveCamera(38,innerWidth/innerHeight,.01,30);cam.position.set(3,2.8,5);cam.lookAt(0,1.15,0);renderer.render(scene,cam);window.ready=true;window.openDoor=()=>{door.userData.doorLeaf.rotation.y=-Math.PI/2;renderer.render(scene,cam);};
</script></body></html>
