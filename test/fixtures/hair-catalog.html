<!doctype html><html><head><meta charset="utf-8"><title>后发素材核对</title><style>body{display:flex;flex-wrap:wrap;margin:0}figure{width:118px;margin:3px;font:12px sans-serif;background:#eee}img{width:118px;height:118px}</style></head><body><script type="module">const items=await fetch('/like520/parts/manifest.json').then(r=>r.json());for(const item of items.filter(i=>i.categoryKey==='back2')){const f=document.createElement('figure'),img=new Image(),label=document.createElement('figcaption');img.src='/like520/'+item.src;label.textContent=item.id;f.append(img,label);document.body.append(f);}</script></body></html>
