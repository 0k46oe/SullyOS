<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>拍照姿势 · CC0 候选</title>
<style>body{margin:0;background:#f5f3ee;color:#24392f;font:15px system-ui}header{padding:22px 30px;border-bottom:1px solid #cdd4c8}h1{margin:0 0 8px;font-size:26px}p{line-height:1.6;margin:8px 0}main{display:grid;grid-template-columns:minmax(440px,1fr) 430px;gap:24px;padding:24px}#preview{position:sticky;top:20px;align-self:start}#stage{height:520px;border-radius:16px;overflow:hidden;background:#e8eee4}canvas{display:block;width:100%;height:100%;touch-action:none}button,select,input{font:inherit;border:1px solid #b9c5b9;border-radius:8px;padding:9px;background:#fff;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#254c3d;color:white}nav,.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}#cards button{text-align:left;min-height:145px}#cards img{width:100%;height:125px;object-fit:contain;background:#e8eee4}#cards strong,#cards small{display:block;margin-top:5px}#cards small{font-size:11px;color:#647469}#cards button[aria-pressed=true] small{color:#dce7df}#source a{margin-right:12px}#search{box-sizing:border-box;width:100%;margin-bottom:14px}.notice{padding:12px;background:#ebe6dc;border-radius:8px;color:#655740}#mark{min-width:140px}@media(max-width:850px){main{display:block;padding:14px}#preview{position:static}#stage{height:380px}#cards{grid-template-columns:repeat(3,1fr)}}</style></head>
<body><header><h1>拍照姿势 · CC0 候选</h1><p>静态定格，逐个挑选。这里查看源姿势，尚未适配小人、未接入拍照功能。</p><p class="notice">双人栏是 CC0 单人姿势的构图组合示意，非原作者成套双人姿势；本轮未找到可核实 CC0 的原生拥抱、牵手等双人姿势包。</p></header>
<main><section id="preview"><h2 id="title">载入候选…</h2><div id="stage"></div><div class="tools"><button id="prev">← 上一个</button><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button><button id="next">下一个 →</button></div><p>拖动旋转 · 滚轮缩放 · 右键平移。椅子、杯子、吉他等道具不包含。</p><p id="detail"></p><p id="source"></p><div class="tools"><button id="mark">☆ 待选</button><button id="export">导出勾选清单</button></div><p id="status" role="status"></p></section>
<aside><nav id="filters"><button data-filter="new">新增 36</button><button data-filter="single">全部单人 90</button><button data-filter="pair">双人组合 6</button><button data-filter="saved">已勾选</button></nav><input id="search" placeholder="搜索名称 / 作者"><div id="cards"></div></aside></main><script type="module" src="./photo-cc0-review.js"></script></body></html>
