<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#eee8e1}canvas{display:block}#labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);pointer-events:none}span{padding:15px;font:22px sans-serif}</style></head><body><div id="labels"></div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';const scene=new T.Scene();scene.background=new T.Color('#eee8e1');scene.add(new T.HemisphereLight('#ffffff','#9d8c7e',2));const light=new T.DirectionalLight('#fff4e7',3);light.position.set(4,7,6);scene.add(light);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const cam=new T.OrthographicCamera(-5,5,2, -2,.1,100);cam.position.set(0,0,20);const params=new URLSearchParams(location.search);
for(let i=1;i<=10;i++){const model=(await new GLTFLoader().loadAsync('/art/jellyfish-home/sources/bathroom-'+i+'-geometry.glb')).scene,b=new T.Box3().setFromObject(model),s=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3());model.position.sub(c);const g=new T.Group();g.add(model);g.scale.setScalar(1.55/Math.max(s.x,s.y,s.z));g.rotation.set(.32,params.has('back')?Math.PI+.5:.5,0);g.position.set(-4+(i-1)%5*2,.98-Math.floor((i-1)/5)*2,0);scene.add(g);document.querySelector('#labels').innerHTML+='<span>'+i+'</span>';}cam.updateProjectionMatrix();renderer.render(scene,cam);window.ready=true;
</script></body></html>
