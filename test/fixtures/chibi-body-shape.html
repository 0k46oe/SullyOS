<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>当前角色与素体</title><style>body{margin:0;background:#f4eee8;font-family:sans-serif;color:#64596c}header{text-align:center;padding:14px}button{margin:4px;padding:8px 14px}canvas{display:block;width:100%}#bridge{display:none}main{display:flex;align-items:flex-start}#stage{flex:1;min-width:0}aside{width:280px;padding:16px;box-sizing:border-box;max-height:calc(100vh - 140px);overflow:auto}summary{cursor:pointer;margin-bottom:14px;font-weight:bold}select{width:100%;padding:8px}details{margin-bottom:18px}fieldset{border:1px solid #cec3ba;margin:12px 0;padding:10px}label{display:grid;grid-template-columns:32px 1fr 48px;gap:6px;align-items:center;margin:12px 0;font-size:13px}input{min-width:0;width:100%;box-sizing:border-box}aside p{font-size:12px;line-height:1.6}aside button{margin:4px 0}@media(max-width:700px){main{flex-direction:column}aside{width:100%}#stage{width:100%}}</style></head><body><header>左：当前角色　／　右：纯色素体<br><button onclick="window.pose('idle',0)">正面</button><button onclick="window.pose('idle',Math.PI/2)">侧面</button><button onclick="window.pose('idle',Math.PI)">背面</button><button onclick="window.face()">五官近看 / 全身</button><button onclick="window.clothes()">帽衫 / 素体</button><br><button onclick="window.rigPose('bind')">绑定姿势</button><button onclick="window.rigPose('relaxed')">自然站立</button><button onclick="window.rigPose('reference')">图三站姿</button><button onclick="window.rigPose('arm')">抬手测试</button><button onclick="window.rigPose('knee')">屈膝测试</button><button onclick="window.rigPose('head')">转头测试</button><button onclick="window.skeleton()">显示 / 隐藏骨架</button><button onclick="window.downloadRig()">导出绑骨素体</button></header><main><div id="stage"></div><aside><details open><summary>动作编辑</summary><p>点击角色上的青色方框选关节，拖动彩色圆环旋转。橙色为选中关节，右侧角度同步更新。左右按角色自身区分。</p><button onclick="window.poseHandles()">显示 / 隐藏关节手柄</button><di
