<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水手服 · 贴图画室</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeee8;color:#303b34;font:14px system-ui}header{height:76px;padding:16px 24px;display:flex;align-items:center;gap:22px;border-bottom:1px solid #ccd2c6}h1{font-size:21px;margin:0}small{color:#6b756c}button,select,input{font:inherit}button,select{padding:9px 12px;border:1px solid #c9cec5;border-radius:7px;background:#fafbf7;color:inherit;cursor:pointer}button.active{background:#335542;color:white}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 146px)}section{position:relative;min-width:0;overflow:hidden;border-right:1px solid #cbd2c5}#stage{width:100%;height:100%}.label{position:absolute;top:14px;left:20px;pointer-events:none;background:#eeeeeadb;padding:6px 10px;border-radius:6px}.views{position:absolute;bottom:16px;left:20px;display:flex;gap:6px}#sheet{width:100%;height:100%;touch-action:none;cursor:crosshair}footer{height:70px;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.tools{margin-left:auto;display:flex;gap:8px;align-items:center}#size{width:95px}#notice{position:absolute;bottom:16px;right:15px;background:#f7f8f2e8;padding:8px;max-width:60%;font-size:12px}a{color:#41644d}input[type=color]{width:42px;height:34px;border:0;background:none}#state{font-size:12px;color:#596754;max-width:260px}@media(max-width:850px){main{grid-template-columns:1fr;height:auto}section{height:65vh}header{height:auto;flex-wrap:wrap}.tools{margin-left:0;flex-wrap:wrap}footer{height:auto}}
</style><header><div><h1>水手服 · 贴图画室</h1><small>左边看效果，右边画展开图</small></div><a href="./?quality=sailor-school">返回调姿</a><div class="tools"><button id="orbit" class="active">转动模型</button><button id="paint">模型上画</button><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button></div></header>
<main><section><div id="stage"></div><div class="label">3D 实时预览</div><div class="views"><button data-view="front">正面</button><button data-view="back">背面</button><button data-view="cuff">看袖口</button><button id="pose">切换 T / 垂手</button></div><div id="notice">正在加载…</div></section><section><canvas id="sheet"></canvas><div class="label">UV 展开 · 滚轮缩放 / 空格拖动</div></section></main>
<footer><input id="color" type="color" value="#354057" aria-label="画笔颜色"><label>笔宽 <input id="size" type="range" min="1" max="100" value="12"><output id="sizeValue">12</output></label><button id="pick">取色</button><label><input id="wire" type="checkbox" checked>展开线</label><button id="fit">适应画布</button><button id="png">导出贴图</button><button id="uv">导出展开线</button><button id="glb">导出模型</button><button id="import">导入贴图</button><input id="file" type="file" accept="image/png,image/jpeg" hidden><span id="state" role="status"></span></footer><script type="module" src="./paint.js"></script></html>
