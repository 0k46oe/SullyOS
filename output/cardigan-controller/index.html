<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>开衫 · 姿势工作台</title><link rel="stylesheet" href="./style.css"></head><body>
<main><section id="stage"><header><b>开衫 · 姿势工作台</b><span>外套 · 半落肩开衫 / 已确认</span></header><div id="viewport"></div><nav id="views"><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button id="home">复位视角</button></nav><p class="hint">拖动空白处转动视角 · 滚轮缩放 · 拖动彩色圆环旋转关节</p></section>
<aside><div class="intro"><small>POSE STUDIO</small><h1>找到舒服的姿态</h1><p>衣服与身体一起动，边调边看。</p></div><fieldset id="presets"><legend>从一个姿势开始</legend><button data-preset="default">默认站姿</button><button data-preset="T">T 姿</button><button data-preset="A">A 姿</button><button data-preset="relaxed">自然垂手</button></fieldset>
<label class="toggle"><input type="checkbox" id="symmetric" checked>左右对称<span>镜像跟随</span></label><div class="selects"><label>调整一侧<select id="side"><option value="L">角色左侧</option><option value="R">角色右侧</option></select></label><label>关节<select id="joint"><option value="upperArm">上臂 / 肩关节</option><option value="clavicle">锁骨 / 肩带</option><option value="forearm">小臂 / 肘部</option><option value="hand">手腕</option></select></label></div>
<div id="sliders"></div><div class="row"><button id="zero">此关节归零</button><button id="undo">撤销</button></div><label class="toggle secondary"><input type="checkbox" id="handles" checked>显示旋转控制器</label><label class="toggle secondary"><input type="checkbox" id="clothing" checked>显示服装</label>
<label class="toggle secondary" for="curl">双手放松程度 <output id="curl-value">45%</output></label><input id="curl" type="range" min="0" max="100" value="45" aria-label="双手放松程度" style="width:100%;accent-color:#42634e"><p style="margin:4px 0">张开 ← → 握紧</p><section id="motion-panel"></section><footer><div class="row"><button id="png" class="primary">保存透明图片</button><button id="export">导出姿势</button></div><div class="row"><button id="import">导入姿势</button><button id="glb">导出当前模型</button></div><input type="file" id="file" accept=".json,application/json" hidden><p id="status" role="status">正在加载小人和服装…</p></footer></aside></main><script type="module" src="./app.js"></script></body></html>
