name = "sullyos-amsg"
# 已经 esbuild 打好的整包（pnpm build:workers 产出），wrangler 直接发它，
# 不需要在部署侧再装依赖、再构建一次。
main = "worker.bundle.js"
compatibility_date = "2026-01-01"
# amsg-server 2.6.0-next.2 起全 Web Crypto，不需要 nodejs_compat。

# wrangler deploy 会用本地这份配置整体覆盖 Cloudflare 面板上的设置——
# 不显式写这段，面板里手动开的 Workers Logs（实时日志）会被一起关掉。
# amsg2 排障（[amsg:expire-skip] / [amsg:agentic] / [amsg:fire-state-missing]
# 这些日志）全靠它，所以这里显式声明成开。
[observability]
enabled = true

[observability.logs]
enabled = true

# 主动消息 2.0 的单用户后端：定时任务存 D1，到点由 Cron Trigger 推送。
#
# 部署：
#   1) wrangler d1 create sullyos-amsg      # 拿到 database_id
#   2) 把 database_id 填到下面
#   3) 设密钥（见文末），然后 wrangler deploy
#   （表结构不用手动建：前端点「连接」时 POST /init-tenant 会幂等创建）

[[d1_databases]]
binding = "DB"
database_name = "sullyos-amsg"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 每分钟查一次到点任务（UTC）。这是主动消息唯一的投递触发方式——
# 没有 send-notifications 这类 HTTP 端点，关掉 cron 等于整个功能停摆。
[triggers]
crons = ["* * * * *"]

# Secrets（用 `wrangler secret put <名字>` 或面板设置，别写进本文件）：
#   AMSG_MASTER_KEY     64 位 hex；SullyOS 设置页能一键生成
#   VAPID_PUBLIC_KEY    必须和 SullyOS「推送凭据 (VAPID)」面板里的是同一对，
#   VAPID_PRIVATE_KEY   否则 worker 用别的密钥对签推送会 403
#   VAPID_EMAIL         可选；缺则回退 mailto: 默认值
#   AMSG_SERVER_TOKEN   可选；配了则所有端点强制校验 X-Client-Token
